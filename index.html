      const n = ni.value.trim(), q = Math.max(1, parseInt(nq.value, 10) || 1); if (!n){ ni.focus(); return; }
      mutate(() => { const ex = c.inventory.find(x => x.name.toLowerCase() === n.toLowerCase());
        if (ex) ex.qty += q; else c.inventory.push({id: slug(n) + '-' + uid().slice(0,4), name: n, qty: q, weight: null, attuned: false, magic: /potion|scroll|\+\d|wand|ring of|cloak of|boots of/i.test(n), consumable: /potion|scroll|ration|arrow|bolt|oil|torch/i.test(n), open5eKey: null, notes: ''}); });
      break; }
    case 'delitem': mutate(() => c.inventory = c.inventory.filter(x => x.id !== d.iid)); closeModal(); toast('Item removed (Undo to restore)'); break;
    case 'itemflag': { const v = t.checked; snap(); c.inventory.find(x => x.id === d.iid)[d.k] = v; save(); renderGrid(); break; }
    case 'purse': purseModal(); break;
    case 'coin': { const n = parseInt($('#coinAmt').value, 10), k = $('#coinType').value, note = $('#coinNote').value.trim();
      if (!(n > 0)) return;
      if (+d.d < 0 && S.purse[k] < n){ toast(`Only ${S.purse[k]} ${k} in the purse`, true); return; }
      mutate(() => { S.purse[k] += n * +d.d; if (note) logEntry([], `${+d.d > 0 ? 'Gained' : 'Spent'} ${n} ${k}: ${note}`); }); break; }
    case 'checks': checksModal(); break;
    case 'journal': journalModal(); break;
    case 'jtab': UI.journalTab = d.v; saveUI(); UI.modal(); break;
    case 'jtag': { const i = UI.tags.indexOf(d.cid); i >= 0 ? UI.tags.splice(i,1) : UI.tags.push(d.cid); const txt = $('#jtext').value; UI.round = $('#jround').value; UI.modal(); $('#jtext').value = txt; $('#jtext').focus(); break; }
    case 'jadd': addJournal(); break;
    case 'jstar': mutate(() => { const en = S.log.find(x => x.id === d.eid); en.star = !en.star; }); break;
    case 'jdel': mutate(() => S.log = S.log.filter(x => x.id !== d.eid)); toast('Entry deleted (Undo to restore)'); break;
    case 'newsession': mutate(() => { S.session++; UI.round = ''; }); toast(`Session ${S.session} started`); break;

    case 'shortRest': shortRestModal(); break;
    case 'spendhd': {
      const inp = document.querySelector(`[data-hdroll="${d.cid}|${d.die}"]`); const roll = parseInt(inp.value, 10);
      if (!(roll > 0)){ inp.focus(); toast('Type the hit die roll first'); return; }
      const amt = Math.max(0, roll + c.abilities.con.mod);

      toast(`${esc(c.name)} heals ${amt}`); break; }
    case 'doShort': closeModal(); mutate(() => S.characters.forEach(shortRestChar)); toast('Short rest finished'); break;
    case 'longRest': longRestModal(); break;
    case 'doLong': closeModal(); mutate(() => S.characters.forEach(longRestChar)); toast('Long rest finished: everyone refreshed'); break;
    case 'ruleset': mutate(() => S.ruleset = d.v); break;
    case 'undo': undo(); break;
    case 'menu': dataModal(); break;
    case 'importUpdate': jsonMode = 'merge'; $('#fileJson').click(); break;
    case 'restoreJson': jsonMode = 'restore'; $('#fileJson').click(); break;
    case 'exportJson': flushSave(); download(`${slug(S.name || 'campaign')}-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({campaign: S, portraits: P}, null, 1)); break;
    case 'copyJson': flushSave(); copyText(JSON.stringify({campaign: S, portraits: P}), 'Campaign'); break;
    /* --- campaigns --- */
    case 'home': goHome(); break;
    case 'campopen': openCampaign(d.id); break;
    case 'newcamp': newCampModal(); break;
    case 'newcampfile': UI._newName = ($('#ncName') && $('#ncName').value.trim()) || ''; jsonMode = 'newcamp'; $('#fileJson').click(); break;
    case 'docreatecamp': {
      const name = ($('#ncName') && $('#ncName').value.trim()) || 'New campaign';
      const st = emptyState(name), img = {};
      document.querySelectorAll('[data-pick]:checked').forEach(el => { const o = UI._others[+el.dataset.pick]; const x = freshCopy(o.c); x.id = uniqueId(st, x.id);
        st.characters.push(x); const pimg = lsGet(kImg(o.camp.id), {})[o.c.id]; if (pimg) img[x.id] = pimg; });
      if (VIEW === 'party') flushSave();
      openCampaign(createCampaign(st, img)); toast(`Created ${esc(name)}`); break; }
    case 'camprename': campRenameModal(d.id); break;
    case 'docamprename': { const e = campById(d.id), nm = $('#pname').value.trim() || e.name; e.name = nm;
      const st = lsGet(kState(d.id), null); if (st){ st.name = nm; lsSet(kState(d.id), st); } if (S && IDX.current === d.id) S.name = nm;
      saveIndex(); closeModal(); renderAll(); break; }
    case 'campdup': { const e = campById(d.id); const st = lsGet(kState(d.id), null); if (!st) break; st.name = e.name + ' (copy)';
      createCampaign(st, lsGet(kImg(d.id), {})); toast('Duplicated'); renderAll(); break; }
    case 'campexport': { const e = campById(d.id); download(`${slug(e.name)}-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({campaign: lsGet(kState(d.id), null), portraits: lsGet(kImg(d.id), {})}, null, 1)); break; }
    case 'camparch': { const e = campById(d.id); e.archived = !e.archived; saveIndex(); renderAll(); break; }
    case 'campdel': { const e = campById(d.id); e.deleted = true; if (IDX.current === d.id) IDX.current = null; saveIndex(); renderAll(); toast(`${esc(e.name)} moved to Recently deleted`); break; }
    case 'camprestore': { const e = campById(d.id); e.deleted = false; saveIndex(); renderAll(); break; }
    case 'camppurge': { const id = d.id; openModal(() => `${mhead('Delete forever?')}<div class="mbody">This permanently removes <b>${esc(campById(id).name)}</b>, its journal and portraits from this browser. Export it first if you might want it back.</div>
        <div class="mfoot"><button data-act="mclose">Cancel</button><button class="b-dmg" data-act="dopurge" data-id="${id}">Delete forever</button></div>`); break; }
    case 'dopurge': { try { localStorage.removeItem(kState(d.id)); localStorage.removeItem(kImg(d.id)); localStorage.removeItem(kUI(d.id)); } catch(err){}

    case 'exportall': download(`party-manager-everything-${new Date().toISOString().slice(0,10)}.json`,
      JSON.stringify({everything: IDX.list.filter(e => !e.deleted).map(e => ({campaign: lsGet(kState(e.id), null), portraits: lsGet(kImg(e.id), {})}))}, null, 1)); break;

      if (i < 0 || j < 0 || j >= S.characters.length) break;
      mutate(() => { const [x] = S.characters.splice(i, 1); S.characters.splice(j, 0, x); }); break; }
    case 'editcore': charForm(d.cid); break;
    case 'updatechar': UI._updateTarget = d.cid; jsonMode = 'update'; $('#fileJson').click(); break;
    case 'savechar': {
      const v = readCharForm(d.cid || null); if (!v) break;
      const hpMax = v.hpMax; delete v.hpMax; closeModal();
      if (d.cid){
        mutate(() => { const c2 = charById(d.cid);
          if (hpMax && hpMax !== c2.hp.max){ const diff = hpMax - c2.hp.max; c2.hp.max = hpMax; c2.hp.current = Math.max(0, Math.min(hpMax, c2.hp.current + Math.max(0, diff))); }
          Object.assign(c2, v); c2.coreEdited = true; });
        toast('Saved');
      } else {
        let nid;
        mutate(() => { const c2 = normaliseChar(Object.assign({schema:'mnz-party/1', id: uniqueId(S, slug(v.name)), xp:0, hp:{max: hpMax || 10},
          attacks:[], resources:[], spells:[], features:[], inventory:[], notes:{}, custom:true}, v)); nid = c2.id; S.characters.push(c2); UI.open[c2.id] = true; });

function addJournal(){
  const txt = $('#jtext').value.trim(); if (!txt){ $('#jtext').focus(); return; }
  UI.round = $('#jround').value;
  const star = $('#jstar').checked;
  mutate(() => { logEntry(UI.tags.slice(), txt); S.log[S.log.length-1].star = star; });
  UI.tags = []; UI.modal(); $('#jtext').focus();
}
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeModal(); });

/* ---------- drag to reorder: drop on a card's left/right half (top/bottom in one column) ---------- */
let dragCid = null;
const oneCol = () => getComputedStyle($('#grid')).gridTemplateColumns.split(' ').length < 2;
function dropSide(card, e){ const r = card.getBoundingClientRect(); return oneCol() ? (e.clientY < r.top + r.height / 2 ? 'before' : 'after') : (e.clientX < r.left + r.width / 2 ? 'before' : 'after'); }
function clearDropMarks(){ document.querySelectorAll('.card.drop-before,.card.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after')); }
$('#grid').addEventListener('dragstart', e => {
  const h = e.target.closest && e.target.closest('[data-drag]'); if (!h) return;
  dragCid = h.dataset.drag;
  const card = h.closest('.card');
  try { e.dataTransfer.setData('text/plain', dragCid); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setDragImage(card, 30, 30); } catch(err){}
  $('#grid').classList.toggle('one-col', oneCol());
  // add the class after the browser has taken its drag snapshot
  setTimeout(() => card.classList.add('dragging'), 0);
  h.addEventListener('dragend', () => { dragCid = null; clearDropMarks(); document.querySelectorAll('.card.dragging').forEach(x => x.classList.remove('dragging')); }, {once: true});
});
$('#grid').addEventListener('dragover', e => {
  if (!dragCid) return;
  const card = e.target.closest('.card[data-cid]'); if (!card || card.dataset.cid === dragCid) { clearDropMarks(); return; }
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const side = dropSide(card, e);
  if (!card.classList.contains('drop-' + side)){ clearDropMarks(); card.classList.add('drop-' + side); }
});
$('#grid').addEventListener('dragleave', e => { if (!e.relatedTarget || !$('#grid').contains(e.relatedTarget)) clearDropMarks(); });
$('#grid').addEventListener('drop', e => {
  if (!dragCid) return;
  const card = e.target.closest('.card[data-cid]'); e.preventDefault(); clearDropMarks();
  const from = dragCid; dragCid = null;
  if (!card || card.dataset.cid === from) { renderGrid(); return; }
  const side = dropSide(card, e), to = card.dataset.cid;
  mutate(() => {
    const i = S.characters.findIndex(x => x.id === from); const [x] = S.characters.splice(i, 1);
    const j = S.characters.findIndex(y => y.id === to);
    S.characters.splice(side === 'before' ? j : j + 1, 0, x);
  });
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.note) snap(); });
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset; if (!d || !d.note) return;
  const c = d.cid ? charById(d.cid) : null;
  if (d.note === 'char') c.myNotes = t.value;
  if (d.note === 'bio'){ c.notes = c.notes || {}; c.notes[d.k] = t.value; }
  if (d.note === 'shared') S.sharedNotes = t.value;
  if (d.note === 'item') c.inventory.find(x => x.id === d.iid).notes = t.value;
  save();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.resmax){ const v = parseInt(t.value, 10); if (v > 0) mutate(() => { const r = resById(charById(t.dataset.cid), t.dataset.resmax); r.max = v; r.used = 0; }); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#scrim').classList.contains('open')) closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && VIEW === 'party' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.hpin) document.querySelector(`[data-act="hp"][data-op="dmg"][data-cid="${e.target.dataset.hpin}"]`).click();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.newitem) document.querySelector(`[data-act="additem"][data-cid="${e.target.dataset.newitem}"]`).click();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'jtext'){ e.preventDefault(); addJournal(); }
});

window.addEventListener('resize', () => { const s = sideMode(); if (s !== lastSide){ lastSide = s; renderAll(); } else document.documentElement.style.setProperty('--toph', $('.top').offsetHeight + 'px'); });

/* boot: reopen the last campaign, or show the campaigns page */
loadLook();
bootStorage();
if (IDX.current && campById(IDX.current) && !campById(IDX.current).deleted) openCampaign(IDX.current); else { VIEW = 'home'; renderAll(); }
lastSide = sideMode();
</script>
