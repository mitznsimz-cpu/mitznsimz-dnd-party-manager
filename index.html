<style>
/* ── Palette: the Encounter Tracker's tokens, so both apps share one look ── */
:root{
  --bg:#0e0d0b; --bg2:#161410; --bg3:#1e1b16; --bg4:#252118; --bg5:#2c2720;
  --border:#3a3428; --border2:#4e4438;
  --gold:#c9a84c; --gold2:#e8c96a; --gold-dim:#7a6128; --gold-d:#5a3e08;
  --red:#CC4848; --red2:#F05A5A; --green:#4a8c4a; --green2:#6ab86a; --amber:#c8841a; --amber2:#e8a030;
  --blue:#4A7EAC; --blue2:#5a9ecc; --purple:#9060B0; --purple2:#B07ADA;
  --text:#e8dfc8; --text2:#a89878; --text3:#BA9C86;
  --accent:var(--gold); --accent-bright:var(--gold2); --accent-fill:var(--gold-dim); --accent-fill-2:var(--gold-d); --on-accent:var(--bg);
  --font-display:'Cinzel','Palatino Linotype',Palatino,'Times New Roman',serif;
  --font-body:'Crimson Pro','Crimson Text',Palatino,'Book Antiqua',Georgia,serif;
  /* Party Manager roles, built on the tokens above */
  --panel:var(--bg3); --panel2:var(--bg4); --line:var(--border); --muted:var(--text2); --dim:#857660;
  --goldbg:var(--gold-d); --redbg:#3a1714; --greenbg:#17301c; --bluebg:#162a3d;
  --cond-bg:#3b2030; --cond-line:#7a3a5c; --cond-on:#c0508a; --exh-bg:#3a2a10; --exh-line:#a0752a;
  --hp-high:#3f7f3f; --hp-mid:#b47a1c; --hp-low:#b03a3a; --hp-text:#fff; --hp-shadow:0 1px 2px #000;
  --r:8px; --shadow:0 6px 24px rgba(0,0,0,.55);
  --serif:var(--font-display); --sans:var(--font-body);
}
html[data-theme="light"]{
  --bg:#f4f1eb; --bg2:#ede9e0; --bg3:#e4dfd4; --bg4:#d8d2c5; --bg5:#ccc5b5;
  --border:#c0b89e; --border2:#a89e85;
  --gold:#75560f; --gold2:#5a3e08; --gold-dim:#735614; --gold-d:#ecdcae;
  --red:#a03030; --red2:#983030; --green:#2a6a2a; --green2:#2A6A2A; --amber:#834f0d; --amber2:#815015;
  --blue:#2a5a8a; --blue2:#2A5E8A; --purple:#6a3a8a; --purple2:#7A3A9A;
  --text:#1e1a14; --text2:#4a3e28; --text3:#625432; --dim:#7a6c50;
  --redbg:#f3d9d4; --greenbg:#d9ebd3; --bluebg:#d8e6f3;
  --cond-bg:#f3dfe9; --cond-line:#b06a8c; --cond-on:#8a2f5c; --exh-bg:#f3e3c6; --exh-line:#a0752a;
  --hp-high:#9fcb94; --hp-mid:#e6c07a; --hp-low:#e8a49c; --hp-text:#1e1a14; --hp-shadow:none;
  --shadow:0 4px 16px rgba(0,0,0,.18);
}
html[data-theme="light"] body{font-weight:500}
/* Accent themes: identical to the Encounter Tracker's */
html[data-theme="dark"][data-accent="blue"]{--gold:#6aa6d8;--gold2:#a8d4f2;--gold-dim:#2a557e;--gold-d:#1c3c5c;--amber:#4a90c0;--amber2:#82c2ea}
html[data-theme="dark"][data-accent="green"]{--gold:#6ab86a;--gold2:#a4e2a4;--gold-dim:#2e5e2e;--gold-d:#1e421e;--amber:#5aa85a;--amber2:#8ad08a}
html[data-theme="dark"][data-accent="red"]{--gold:#e07a6a;--gold2:#f4b0a4;--gold-dim:#7a2e26;--gold-d:#5a1e18;--amber:#d06a5a;--amber2:#f09080}
html[data-theme="dark"][data-accent="purple"]{--gold:#b486dc;--gold2:#d6b2f2;--gold-dim:#553a78;--gold-d:#3e2a5a;--amber:#9a6cc4;--amber2:#c69cea}
html[data-theme="dark"][data-accent="silver"]{--gold:#b8c0c8;--gold2:#dfe5ea;--gold-dim:#454c52;--gold-d:#363c41;--amber:#9aa2aa;--amber2:#c8ced4}
html[data-theme="light"][data-accent="blue"]{--gold:#1f5b94;--gold2:#10405f;--gold-dim:#2a557e;--gold-d:#cfe2f2;--amber:#256a9c;--amber2:#1c4f78}
html[data-theme="light"][data-accent="green"]{--gold:#2f6b2f;--gold2:#1d4a1d;--gold-dim:#2e5e2e;--gold-d:#d2e8c8;--amber:#3a702f;--amber2:#244f1c}
html[data-theme="light"][data-accent="red"]{--gold:#a83c2c;--gold2:#7a261a;--gold-dim:#7a2e26;--gold-d:#f3d6cf;--amber:#9c3a2a;--amber2:#722018}
html[data-theme="light"][data-accent="purple"]{--gold:#6e3fa0;--gold2:#4a2870;--gold-dim:#553a78;--gold-d:#e2d2f2;--amber:#74469c;--amber2:#452a5a}
html[data-theme="light"][data-accent="silver"]{--gold:#566069;--gold2:#3a4148;--gold-dim:#5f6970;--gold-d:#dfe3e7;--amber:#646e76;--amber2:#3c4248}
/* Legible font: system sans everywhere */
html[data-font="legible"]{--font-display:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--font-body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.accent-row{display:flex;gap:8px;flex-wrap:wrap}
.accent-swatch{width:30px;height:30px;border-radius:6px;background:var(--sw);border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s,border-color .12s}
.accent-swatch:hover{transform:scale(1.12);border-color:var(--border2)}
.accent-swatch.active{border-color:var(--text)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--sans);font-variant-numeric:lining-nums;transition:background .2s,color .2s}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.pri{background:var(--accent-fill);border-color:var(--accent);color:var(--accent-bright)}
button.pri:hover{background:var(--accent);color:var(--on-accent)}
html[data-theme="light"] button.pri{background:var(--accent);color:var(--bg)}
html[data-theme="light"] button.pri:hover{background:var(--gold2);color:var(--bg)}
button.gold{background:var(--goldbg);border-color:var(--gold);color:var(--gold2)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{border-color:var(--line)}
button:disabled{opacity:.4;cursor:default}
button.small{padding:2px 8px;font-size:12px}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{width:100%;resize:vertical;min-height:70px}
h1,h2,h3{font-family:var(--serif);margin:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.link{cursor:pointer} .link:hover{color:var(--gold2);text-decoration:underline}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font:400 19px var(--font-display);color:var(--gold2);letter-spacing:.06em}
.brand .sub{font-size:12px;color:var(--muted)}
.purse-chip{display:flex;gap:8px;align-items:center;background:var(--goldbg);border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:4px 12px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:4px 9px}
.seg button.on{background:var(--accent-fill);color:var(--accent-bright)}
html[data-theme="light"] .seg button.on{background:var(--accent);color:var(--bg)}

/* ---------- grid ---------- */
.layout{display:flex;align-items:flex-start}
.layout .grid{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px;align-items:start}
.layout.side .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.dock{display:none;width:clamp(400px,32vw,520px);flex:none;position:sticky;top:var(--toph,52px);height:calc(100vh - var(--toph,52px));overflow:auto;border-left:1px solid var(--border2);background:var(--bg2)}
.layout.side .dock.has{display:block}
.dock .dnav{position:sticky;top:0;z-index:2;display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--bg3);border-bottom:1px solid var(--line)}
.dock .dnav .chip.on{border-color:var(--gold);color:var(--gold2)}
.dock .dblk{border-bottom:2px solid var(--line)}
.dock .dhd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(135deg,var(--bg4),var(--bg3))}
.dock .dhd .portrait{width:38px;height:38px;font-size:15px;border-radius:8px}
.dock .dhd .cname{font-size:16px}
.card.sbon{border-color:var(--gold)}
@media (max-width:1400px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.grid{grid-template-columns:1fr;padding:8px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.card.down{border-color:var(--red2);box-shadow:0 0 0 1px var(--red2),var(--shadow)}
.chead{display:flex;gap:10px;padding:10px;background:linear-gradient(135deg,var(--bg4),var(--bg3))}
.portrait{width:64px;height:64px;flex:none;border-radius:10px;border:2px solid var(--gold);background:var(--bg5) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:600 22px var(--serif);color:var(--gold2);cursor:pointer;padding:0;overflow:hidden}
.portrait:hover{border-color:var(--gold2)}
.cname{font:600 17px var(--serif);color:var(--gold2);line-height:1.15}
.csub{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:1px 6px;text-align:center;min-width:40px}
.stat .k{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font:600 14px var(--sans);font-variant-numeric:tabular-nums}
.stat.ac{border-color:var(--gold)}
.stat.dc{border-color:var(--purple)}
.stat.atk{border-color:var(--red)}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.sect{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}

/* hp */
.hpbar{position:relative;height:26px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.hpfill{position:absolute;left:0;top:0;bottom:0;background:var(--hp-high);transition:width .2s}
.hpfill.mid{background:var(--hp-mid)}
.hpfill.low{background:var(--hp-low)}
.hptemp{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(74,134,197,.75),rgba(74,134,197,.75) 4px,rgba(74,134,197,.5) 4px,rgba(74,134,197,.5) 8px)}
.hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 14px var(--sans);color:var(--hp-text);text-shadow:var(--hp-shadow);font-variant-numeric:tabular-nums}
.hpctl{display:flex;gap:5px}
.hpctl input{width:60px;text-align:center}
.hpctl button{flex:1;padding:5px 4px}
.b-dmg{background:var(--redbg);border-color:var(--red)}
.b-heal{background:var(--greenbg);border-color:var(--green)}
.b-tmp{background:var(--bluebg);border-color:var(--blue)}
.deathsaves{display:flex;gap:12px;align-items:center;background:var(--redbg);border:1px solid var(--red);border-radius:7px;padding:5px 8px;font-size:12px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);display:inline-block;cursor:pointer;vertical-align:middle;background:transparent;padding:0;flex:none}
.pip.on{background:var(--gold);border-color:var(--gold)}
.pip.used{background:transparent;border-color:var(--dim)}
.pip.avail{background:var(--gold);border-color:var(--gold2)}
.pip.s.on{background:var(--green);border-color:var(--green)}
.pip.f.on{background:var(--red2);border-color:var(--red2)}
.pips{display:inline-flex;gap:3px;align-items:center}

/* chips */
.conds{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:1px 8px;font-size:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.cond{background:var(--cond-bg);border-color:var(--cond-line)}
.chip.conc{background:var(--bluebg);border-color:var(--blue)}
.chip.exh{background:var(--exh-bg);border-color:var(--exh-line)}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.chip .x{opacity:.6;padding-left:2px} .chip .x:hover{opacity:1;color:var(--text)}
.chip.item{background:var(--bg5)}
.chip.act-bonus{border-color:var(--green)} .chip.act-reaction{border-color:var(--amber)} .chip.act-action{border-color:var(--red)}
.qa{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:start;font-size:12px}
.qa .lab{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding-top:3px}
.qa .chips{display:flex;flex-wrap:wrap;gap:3px}

/* card tables */
.saves{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.sv{background:var(--bg2);border:1px solid var(--line);border-radius:6px;text-align:center;padding:1px 0}
.sv .k{font-size:10px;color:var(--muted)}
.sv .v{font-weight:600;font-variant-numeric:tabular-nums}
.sv.prof{border-color:var(--gold)} .sv.prof .k{color:var(--gold)}
.atks{display:grid;grid-template-columns:1fr auto auto;gap:1px 8px;font-size:12.5px;align-items:baseline}
.atks .hit{color:var(--gold2);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.atks .dmg{color:var(--muted);white-space:nowrap}
.uses{display:flex;flex-direction:column;gap:3px}
.userow{display:flex;align-items:center;gap:6px;font-size:12.5px}
.userow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userow .rs{font-size:9.5px;color:var(--dim);text-transform:uppercase}
.userow input{width:56px;padding:1px 4px;font-size:12px}
.slots{display:flex;flex-wrap:wrap;gap:4px 12px}
.slotgrp{display:flex;align-items:center;gap:3px;font-size:12px}
.slotgrp .lv{color:var(--muted);min-width:24px}
.sbtoggle{margin:0 10px 10px;background:var(--bg4);border-color:var(--accent-fill);color:var(--gold2);font-family:var(--serif)}

/* ---------- stat block ---------- */
.sb{border-top:3px solid var(--accent);background:var(--bg2);padding:10px 12px 14px;font-size:14px}
.sb .ital{font-style:italic;color:var(--muted);margin-bottom:4px}
.sb .rule{height:2px;margin:8px 0;background:linear-gradient(90deg,var(--accent),transparent)}
.sb .ln{margin:2px 0}
.sb .ln b{color:var(--gold2)}
.sb table.ab{width:100%;border-collapse:collapse;text-align:center;font-variant-numeric:tabular-nums}
.sb table.ab th{font-size:11px;color:var(--gold2);font-weight:700}
.sb table.ab td{padding:1px 0}
.sb table.ab tr.sv td{font-size:11.5px;color:var(--muted)}
.sb table.ab tr.sv td.p{color:var(--gold2)}
.sb .sh{display:flex;align-items:center;gap:6px;cursor:pointer;margin:12px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--accent-fill);font:600 14px var(--serif);color:var(--gold2);user-select:none;letter-spacing:.03em}
.sb .sh .car{font-size:11px;color:var(--muted);width:10px}
.sb .sh .cnt{font:12px var(--sans);color:var(--muted);margin-left:auto}
.sb .ent{margin:4px 0 6px}
.sb .ent .en{font-weight:700;font-style:italic;cursor:pointer}
.sb .ent .en:hover{color:var(--gold2);text-decoration:underline}
.sb .ent .src{font-size:11px;color:var(--dim)}
.sb .ent .pips{margin-left:6px}
.sb .skg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;font-size:12.5px}
.sb .sk{display:flex;gap:5px;align-items:center}
.sb .sk .mk{width:12px;text-align:center;color:var(--gold)}
.sb .sk .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.sb .sk.none{color:var(--muted)} .sb .sk.none .v{font-weight:400}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:6px;background:var(--bg2);border:1px solid transparent}
.li:hover{border-color:var(--line)}
.li .nm{flex:1;min-width:0;cursor:pointer}
.li .nm:hover{color:var(--gold2)}
.li .meta{font-size:11px;color:var(--muted)}
.tag{font-size:10px;border-radius:4px;padding:0 4px;border:1px solid var(--line);color:var(--muted)}
.tag.c{border-color:var(--blue);color:var(--blue2)}
.tag.r{border-color:var(--purple);color:var(--purple2)}
.tag.a{border-color:var(--gold);color:var(--gold2)}
.tag.m{border-color:var(--amber);color:var(--amber2)}
.lvhead{font:600 12.5px var(--serif);color:var(--gold);margin:8px 0 3px;display:flex;align-items:center;gap:6px}
.qty{display:flex;align-items:center;gap:2px}
.qty button{padding:0 6px;line-height:18px}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.scrim.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:12px;width:min(620px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:88vh}
.modal.wide{width:min(1000px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:17px;font-weight:600;color:var(--gold2);flex:1;letter-spacing:.03em}
.mbody{padding:12px 14px;overflow:auto}
.mfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.mbody h3{font-size:14px;color:var(--gold2);margin:12px 0 6px}
.condgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.condgrid button{text-align:left}
.condgrid button.on{background:var(--cond-bg);border-color:var(--cond-on)}
.tabs{display:flex;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:7px 7px 0 0;background:transparent;color:var(--muted);padding:6px 10px}
.tabs button.on{background:var(--panel2);color:var(--gold2)}
table.mx{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.mx th,table.mx td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:center}
table.mx th:first-child,table.mx td:first-child{text-align:left}
table.mx thead th{position:sticky;top:0;background:var(--panel);color:var(--gold2);font-family:var(--serif)}
table.mx td.best{color:var(--gold2);font-weight:700}
table.mx td.p{text-decoration:underline dotted var(--gold)}
table.mx tr.grp td{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:left}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.coin{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center}
.coin .k{font-size:12px;color:var(--gold)}
.coin .v{font:600 22px var(--sans);font-variant-numeric:tabular-nums}
.coin .each{font-size:11px;color:var(--dim)}
.journal-entry{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px}
.journal-entry.star{border-color:var(--gold)}
.journal-entry .jm{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.journal-entry .jt{white-space:pre-wrap;margin-top:3px}
.tagpick{display:flex;flex-wrap:wrap;gap:4px}
.tagpick button{border-radius:14px;padding:2px 10px;font-size:12px}
.tagpick button.on{background:var(--accent-fill);border-color:var(--accent);color:var(--accent-bright)}
html[data-theme="light"] .tagpick button.on{background:var(--accent);color:var(--bg)}
.lookup .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-bottom:8px}
.lookup .meta .k{color:var(--muted)}
.lookup .desc p{margin:0 0 8px}
.lookup .desc table{border-collapse:collapse;margin:6px 0;font-size:12px}
.lookup .desc td,.lookup .desc th{border:1px solid var(--line);padding:2px 6px}
.src2{font-size:11px;color:var(--dim);margin-top:8px}
.diff .dgrp h3{font-size:14px;color:var(--gold2);margin:6px 0}
.diff label{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;background:var(--bg2);margin-bottom:3px;cursor:pointer}
.diff .old{color:var(--muted);text-decoration:line-through}
.diff .new{color:var(--gold2)}
.diff .add{color:var(--green2)}
.diff .rem{color:var(--red2)}
.toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--gold);border-radius:9px;padding:8px 14px;box-shadow:var(--shadow);pointer-events:auto;max-width:90vw}
.toast.warn{border-color:var(--red2);background:var(--redbg)}
.empty{color:var(--dim);font-style:italic;padding:6px}
.homeview{padding:16px 14px;max-width:1500px;margin:0 auto}
.homeview h2{color:var(--gold2);font-size:22px;margin:4px 0 12px}
.homeview h3{color:var(--muted);font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.ccard.cur{border-color:var(--gold)}
.ccard.arch{opacity:.7}
.ccard .ct{font:600 18px var(--serif);color:var(--gold2);cursor:pointer}
.ccard .ct:hover{text-decoration:underline}
.ccard .faces{display:flex;gap:6px;flex-wrap:wrap}
.ccard .face{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:2px 10px 2px 2px;font-size:12px}
.ccard .face .portrait{width:28px;height:28px;border-radius:50%;font-size:11px;border-width:1px;cursor:default}
.ccard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.ccard.new{align-items:center;justify-content:center;border-style:dashed;min-height:150px;cursor:pointer;color:var(--muted)}
.ccard.new:hover{border-color:var(--gold);color:var(--gold2)}
.card.addtile{align-items:center;justify-content:center;border-style:dashed;min-height:180px;cursor:pointer;color:var(--muted);font:600 16px var(--serif)}
.card.addtile:hover{border-color:var(--gold);color:var(--gold2)}
.cmenu{margin-left:auto;align-self:flex-start}
.reorder{display:flex;align-items:center;gap:0;align-self:flex-start;flex:none}
.drag-handle{cursor:grab;opacity:.3;color:var(--muted);user-select:none;padding:2px 3px;font-size:14px;line-height:1}
.drag-handle:hover{opacity:.8;color:var(--gold)}
.mv{background:none;border:none;color:var(--muted);padding:2px 4px;font-size:11px;opacity:.55;line-height:1}
.mv:hover:not(:disabled){opacity:1;color:var(--gold);border:none}
.mv:disabled{opacity:.15;cursor:default}
.mv .v{display:none}
@media (max-width:720px){.mv .h{display:none}.mv .v{display:inline}}
/* on phones the button bar wraps to several rows: let it scroll away instead of covering half the screen */
@media (max-width:720px){.top{position:static}}
@media (pointer:coarse){.drag-handle{display:none}.mv{min-width:30px;min-height:30px}}
.card.dragging{opacity:.4;border-style:dashed}
.card.drop-before{box-shadow:-4px 0 0 var(--gold),var(--shadow)}
.card.drop-after{box-shadow:4px 0 0 var(--gold),var(--shadow)}
.grid.one-col .card.drop-before{box-shadow:0 -4px 0 var(--gold),var(--shadow)}
.grid.one-col .card.drop-after{box-shadow:0 4px 0 var(--gold),var(--shadow)}
body.home .ponly{display:none!important}
body:not(.home) .honly{display:none!important}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.pickgrid label{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.form .sub{grid-column:1/-1;color:var(--gold2);font:600 13px var(--serif);border-bottom:1px solid var(--red);margin-top:6px;padding-bottom:2px}
.form .row6{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.form .row9{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.form .sk3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px}
.form .sk3 label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
.form .sk3 select{flex:none;width:100px;padding:2px 4px;font-size:12px}
.form .sk3 span{flex:1}
@media (max-width:700px){.form .row9{grid-template-columns:repeat(5,1fr)}.form .sk3{grid-template-columns:1fr 1fr}.form .row6{grid-template-columns:repeat(3,1fr)}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select{width:100%;min-width:0}
.fld.chk input{width:auto}
.form .row6 .row input{width:auto}
.fld.wide{grid-column:1/-1}
.fld.chk{flex-direction:row;align-items:center;gap:6px}
.fld input,.fld select,.fld textarea{color:var(--text);font-size:14px}
.fld small{font-size:11px}
.addrow{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.addrow span{font-size:12px;color:var(--muted);cursor:pointer;border-bottom:1px dashed var(--dim)}
.addrow span:hover{color:var(--gold2);border-color:var(--gold)}
.tag.hb{border-color:var(--green);color:var(--green2)}
@media (max-width:560px){.form{grid-template-columns:1fr}}

<body>

<script>
'use strict';
/* =====================================================================
   MitzNSimz Party Manager — prototype
   Single file, vanilla JS, no build. Data lives in localStorage.
   ===================================================================== */
const APP_VERSION = '0.6.0';
const STORAGE_NS = /*NS*/'';   // build sets '' for production, 'dev_' for the dev copy
const K_STATE = STORAGE_NS + 'mnzpm_state_v1';
const K_IMG   = STORAGE_NS + 'mnzpm_portraits_v1';
const K_O5E   = STORAGE_NS + 'mnzpm_o5e_cache_v1';
const K_UI    = STORAGE_NS + 'mnzpm_ui_v1';
const O5E = 'https://api.open5e.com';

const SEED = /*SEED*/null;

const ABILS = ['str','dex','con','int','wis','cha'];
const ABN = {str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
const ABFULL = {str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const SKN = {acrobatics:'Acrobatics',animalHandling:'Animal Handling',arcana:'Arcana',athletics:'Athletics',deception:'Deception',history:'History',insight:'Insight',intimidation:'Intimidation',investigation:'Investigation',medicine:'Medicine',nature:'Nature',perception:'Perception',performance:'Performance',persuasion:'Persuasion',religion:'Religion',sleightOfHand:'Sleight of Hand',stealth:'Stealth',survival:'Survival'};
const CONDITIONS = ['Blinded','Charmed','Deafened','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious'];
const COND_RULES = {
  Blinded:'Can\'t see, and automatically fails any ability check that requires sight. Attack rolls against it have advantage; its own attack rolls have disadvantage.',
  Charmed:'Can\'t attack the charmer or target it with harmful abilities or magical effects. The charmer has advantage on ability checks to interact socially with it.',
  Deafened:'Can\'t hear, and automatically fails any ability check that requires hearing.',
  Frightened:'Disadvantage on ability checks and attack rolls while the source of its fear is in line of sight. Can\'t willingly move closer to the source.',
  Grappled:'Speed becomes 0 and can\'t benefit from bonuses to speed. Ends if the grappler is incapacitated, or if an effect moves it out of the grappler\'s reach.',
  Incapacitated:'Can\'t take actions or reactions.',
  Invisible:'Can\'t be seen without magic or a special sense; counts as heavily obscured for hiding. Attack rolls against it have disadvantage; its attack rolls have advantage.',
  Paralyzed:'Incapacitated; can\'t move or speak. Automatically fails Strength and Dexterity saves. Attack rolls against it have advantage, and any hit from within 5 feet is a critical hit.',
  Petrified:'Turned to a solid substance with its gear. Incapacitated, can\'t move or speak, unaware of its surroundings. Attack rolls against it have advantage. Automatically fails Strength and Dexterity saves. Resistance to all damage; poison and disease are suspended.',
  Poisoned:'Disadvantage on attack rolls and ability checks.',
  Prone:'Can only crawl unless it stands up (costs half its speed). Disadvantage on its attack rolls. Attacks against it have advantage from within 5 feet, otherwise disadvantage.',
  Restrained:'Speed becomes 0. Attack rolls against it have advantage; its attack rolls have disadvantage. Disadvantage on Dexterity saves.',
  Stunned:'Incapacitated; can\'t move, and can speak only falteringly. Automatically fails Strength and Dexterity saves. Attack rolls against it have advantage.',
  Unconscious:'Incapacitated; can\'t move or speak, unaware of its surroundings. Drops what it\'s holding and falls prone. Automatically fails Strength and Dexterity saves. Attack rolls against it have advantage, and any hit from within 5 feet is a critical hit.',
};
const EXH_2014 = ['', 'Disadvantage on ability checks', 'Speed halved', 'Disadvantage on attack rolls and saving throws', 'Hit point maximum halved', 'Speed reduced to 0', 'Death'];
const ACT_LABEL = {action:'Action', bonus:'Bonus action', reaction:'Reaction', special:'Special', passive:'Passive trait'};
const ORD = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
const COINS = ['pp','gp','ep','sp','cp'];
const COIN_GP = {pp:10,gp:1,ep:.5,sp:.1,cp:.01};
const fmtTime = t => String(t||'').replace(/^1A\b/,'Action').replace(/^1BA\b/,'Bonus action').replace(/^1R\b/,'Reaction').replace(/(\d+)m\b/,'$1 min').replace(/(\d+)h\b/,'$1 hr');

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn = n => (n >= 0 ? '+' : '') + n;
const uid = () => Math.random().toString(36).slice(2, 10);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg, warn){
  const t = document.createElement('div'); t.className = 'toast' + (warn ? ' warn' : ''); t.innerHTML = msg;
  $('#toasts').appendChild(t); while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
  setTimeout(() => t.remove(), warn ? 6000 : 3200);
}
function download(name, text, type){
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'application/json'}));
    a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch(e){ toast('Download blocked here: use Copy instead', true); }
}
function copyText(text, what){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => toast(`${what} copied to the clipboard`)).catch(() => toast('Copy was blocked by the browser', true));
}

/* =====================================================================
   STATE
   ===================================================================== */
let S, P = {};          // S = party state, P = portraits {charId: dataURL}
const UI = {open:{}, collapsed:{}, spellView:{}, invView:{}, journalTab:'log', sbMode:'auto', tags:[], round:'', modal:null};
const undoStack = [];
/* ---------- storage: an index of campaigns, then one state + one portrait key per campaign ---------- */
const K_INDEX = STORAGE_NS + 'mnzpm_index_v1';
const kState = id => STORAGE_NS + 'mnzpm_c_' + id;
const kImg   = id => STORAGE_NS + 'mnzpm_img_' + id;
const kUI    = id => K_UI + '_' + id;
let IDX = {list:[], current:null};
let VIEW = 'home';
function lsGet(k, d){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ toast('Could not save: browser storage is full. Export a backup.', true); return false; } }
function saveIndex(){ lsSet(K_INDEX, IDX); }
const campById = id => IDX.list.find(x => x.id === id);
function loadUI(id){
  Object.assign(UI, {open:{}, collapsed:{}, spellView:{}, invView:{}, journalTab:'log'});
  const g = lsGet(K_UI, {}); if (g.sbMode) UI.sbMode = g.sbMode;     // layout choice is global
  Object.assign(UI, lsGet(kUI(id), {}), {modal:null, tags:[]});
}
function saveUI(){
  if (!IDX.current) return;
  lsSet(kUI(IDX.current), {open:UI.open, collapsed:UI.collapsed, spellView:UI.spellView, invView:UI.invView, journalTab:UI.journalTab});
  lsSet(K_UI, {sbMode:UI.sbMode});
}

function normaliseChar(c){
  c.hp = Object.assign({current:c.hp.max, temp:0}, c.hp);
  c.deathSaves = c.deathSaves || {successes:0, failures:0};
  c.conditions = c.conditions || [];
  c.exhaustion = c.exhaustion || 0;
  c.concentration = c.concentration || null;
  c.myNotes = c.myNotes || (c.notes && c.notes.session) || '';
  c.spells = (c.spells||[]).map(s => {
    s.id = s.id || slug(s.name + '-' + s.source);
    if (s.prepared === undefined || s.prepared === null) s.prepared = c.preparedLimit ? !!s.alwaysPrepared : true;
    return s;
  });
  c.inventory = (c.inventory||[]).map(i => { i.id = i.id || slug(i.name); i.notes = i.notes || ''; i.actions = i.actions || []; return i; });
  c.resources = (c.resources||[]).map(r => Object.assign({used:0}, r));
  c.features = (c.features||[]).map(f => Object.assign({id: slug(f.name), act:'passive', src:''}, f));
  c.spellSlots = (c.spellSlots||[]).map(s => Object.assign({used:0}, s));
  c.hitDice = (c.hitDice||[]).map(h => Object.assign({used:0}, h));
  return c;
}
function fromSeed(seed){
  const s = clone(seed);
  // Each sheet carries an equal share of the party fund, so the purse is the sum.
  s.purse = {pp:0,gp:0,ep:0,sp:0,cp:0};
  s.characters.forEach(c => { if (c.coins) COINS.forEach(k => s.purse[k] += c.coins[k]||0); delete c.coins; });
  s.characters = s.characters.map(normaliseChar);
  s.sharedNotes = s.sharedNotes || ''; s.log = s.log || []; s.session = s.session || 1; s.ruleset = s.ruleset || '2014';
  s.appVersion = APP_VERSION;
  return s;
}
/** Bring saved state from older versions up to date without touching session data. */
function upgrade(){
  if (S.appVersion === APP_VERSION) return;
  if (SEED && (!S.appVersion || S.appVersion < '0.2.0')){
    // v0.2 adds detailed features (action type, uses, full text). Features are sheet-owned, so take them from the seed.
    S.characters.forEach(c => { const sc = SEED.characters.find(x => x.id === c.id); if (sc) c.features = clone(sc.features); });
  }
  // Fill any sheet fields added in later versions (e.g. attacksPerAction in 0.2.1)
  if (SEED) S.characters.forEach(c => { const sc = SEED.characters.find(x => x.id === c.id); if (!sc) return;
    ['attacksPerAction','bonusAttack'].forEach(k => { if (c[k] === undefined && sc[k] !== undefined) c[k] = clone(sc[k]); });
    (sc.inventory||[]).forEach(si => { const it = (c.inventory||[]).find(x => x.name === si.name);
      if (it && si.actions && !(it.actions && it.actions.length)) it.actions = clone(si.actions); }); });
  S.characters = S.characters.map(normaliseChar);
  S.appVersion = APP_VERSION; save();
}
/* ---------- appearance: Night/Day, accent and font, the same choices as the Encounter Tracker ---------- */
const K_LOOK = STORAGE_NS + 'mnzpm_look_v1';
const ACCENTS = [['gold','#c9a84c','Gold (default)'],['red','#e07a6a','Red'],['blue','#6aa6d8','Blue'],['green','#6ab86a','Green'],['purple','#b486dc','Purple'],['silver','#c2cad2','Silver']];
let LOOK = {theme:'dark', accent:'gold', font:'default'};
function loadLook(){
  const saved = lsGet(K_LOOK, {}) || {};
  // a saved choice wins; otherwise follow the device's light/dark setting on first visit
  const theme = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyLook(Object.assign({}, saved, {theme}));
}
function applyLook(l){
  Object.assign(LOOK, l);
  if (!ACCENTS.some(a => a[0] === LOOK.accent)) LOOK.accent = 'gold';
  const h = document.documentElement;
  h.setAttribute('data-theme', LOOK.theme);
  if (LOOK.accent !== 'gold') h.setAttribute('data-accent', LOOK.accent); else h.removeAttribute('data-accent');
  if (LOOK.font === 'legible') h.setAttribute('data-font', 'legible'); else h.removeAttribute('data-font');
  const tb = document.getElementById('themeBtn'); if (tb) tb.textContent = LOOK.theme === 'light' ? '☽ Night' : '☀ Day';
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = LOOK.theme === 'light' ? '#ede9e0' : '#1E1B16';
}
function setLook(l){ applyLook(l); lsSet(K_LOOK, LOOK); }
function appearanceModal(){
  openModal(() => `${mhead('Appearance')}<div class="mbody">
    <h3 style="margin-top:0">Mode</h3>
    <span class="seg"><button class="${LOOK.theme === 'dark' ? 'on' : ''}" data-act="setlook" data-k="theme" data-v="dark">☽ Night</button><button class="${LOOK.theme === 'light' ? 'on' : ''}" data-act="setlook" data-k="theme" data-v="light">☀ Day</button></span>
    <h3>Accent</h3>
    <div class="accent-row" role="group" aria-label="Accent colour">${ACCENTS.map(([k, sw, label]) => `<button class="accent-swatch ${LOOK.accent === k ? 'active' : ''}" data-act="setlook" data-k="accent" data-v="${k}" title="${label}" aria-label="${label} accent" style="--sw:${sw}"></button>`).join('')}</div>
    <h3>Font</h3>
    <label class="row"><input type="checkbox" data-act="setlook" data-k="font" data-v="toggle" ${LOOK.font === 'legible' ? 'checked' : ''}> Legible font <span class="small muted">(plain sans-serif everywhere, easier to read at a glance)</span></label>
    <div class="small dim" style="margin-top:12px">The same choices as the Encounter Tracker. Saved on this device.</div>
  </div><div class="mfoot"><button class="pri" data-act="mclose">Done</button></div>`);
}
const emptyState = name => ({schema:'mnz-party/1', name: name || 'New campaign', ruleset:'2014', characters:[], purse:{pp:0,gp:0,ep:0,sp:0,cp:0}, sharedNotes:'', log:[], session:1, appVersion:APP_VERSION});
/** First run of 0.4: the single saved party (or the seed) becomes the first campaign. Old keys stay as a safety copy. */
function bootStorage(){
  IDX = lsGet(K_INDEX, null);
  if (IDX) return;
  IDX = {list:[], current:null};
  let st = lsGet(K_STATE, null); const img = lsGet(K_IMG, {});
  if (!st && SEED) st = fromSeed(SEED);
  if (st){
    const id = 'c' + uid();
    if (!st.name || st.name === 'Party') st.name = 'My campaign';
    lsSet(kState(id), st); lsSet(kImg(id), img);
    const oldUI = lsGet(K_UI, null); if (oldUI) lsSet(kUI(id), oldUI);
    IDX.list.push({id, name: st.name, created: Date.now(), updated: Date.now()});
    IDX.current = id;
  }
  saveIndex();
}
function openCampaign(id){
  const st = lsGet(kState(id), null);
  if (!st){ toast('That campaign\'s data is missing', true); return; }
  S = st; P = lsGet(kImg(id), {}); IDX.current = id; saveIndex();
  undoStack.length = 0; loadUI(id); upgrade(); VIEW = 'party'; closeModal(); window.scrollTo(0,0); renderAll();
}
function goHome(){ flushSave(); VIEW = 'home'; closeModal(); window.scrollTo(0,0); renderAll(); }
let saveTimer = null;
function flushSave(){
  clearTimeout(saveTimer);
  if (!S || !IDX.current) return;
  lsSet(kState(IDX.current), S);
  const e = campById(IDX.current); if (e){ e.updated = Date.now(); e.name = S.name; saveIndex(); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 150); }
function savePortraits(){ if (IDX.current) lsSet(kImg(IDX.current), P); }
window.addEventListener('beforeunload', () => { if (VIEW === 'party') flushSave(); });
function snap(){ undoStack.push(JSON.stringify(S)); if (undoStack.length > 40) undoStack.shift(); }
function undo(){
  if (!undoStack.length) return;
  S = JSON.parse(undoStack.pop()); save(); renderAll(); toast('Undone');
}
function mutate(fn){ snap(); fn(); save(); renderAll(); }
const charById = id => S.characters.find(c => c.id === id);

/* =====================================================================
   RULES HELPERS
   ===================================================================== */
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
const classLine = c => c.classes.map(k => `${k.name} ${k.level}`).join(' / ');
const subLine = c => c.classes.map(k => k.subclass).filter(Boolean).join(' / ');
const resById = (c, id) => c.resources.find(r => r.id === id);
const SIDE_MIN = 1100;
let lastSide = null;   // layout mode at the last render, so a resize across the breakpoint re-renders
const sideMode = () => UI.sbMode === 'side' || (UI.sbMode === 'auto' && window.innerWidth >= SIDE_MIN);
const NUMW = ['zero','one','two','three','four'];
const actOfSpell = s => /^1BA/.test(s.time) ? 'bonus' : /^1R/.test(s.time) ? 'reaction' : 'action';
const usableSpells = c => c.spells.filter(s => s.prepared || s.level === 0);
/** Actions granted by carried items: [{item, a}] */
const itemActs = (c, act) => c.inventory.filter(i => i.qty > 0 && (i.actions||[]).length).flatMap(i => i.actions.filter(a => !act || a.act === act).map(a => ({item: i, a})));

function damage(c, n){
  if (!(n > 0)) return;
  const wasZero = c.hp.current === 0;
  let rest = n;
  if (c.hp.temp > 0){ const t = Math.min(c.hp.temp, rest); c.hp.temp -= t; rest -= t; }
  c.hp.current = Math.max(0, c.hp.current - rest);
  if (wasZero){
    c.deathSaves.failures = Math.min(3, c.deathSaves.failures + 1);
    toast(`${esc(c.name)} takes damage while down: <b>death save failure</b> (${c.deathSaves.failures}/3)`, true);
  } else if (c.hp.current === 0){
    if (!c.conditions.includes('Unconscious')) c.conditions.push('Unconscious');
    toast(`<b>${esc(c.name)} is down!</b>`, true);
    if (c.concentration){ toast(`${esc(c.name)} loses concentration on ${esc(c.concentration)}`, true); c.concentration = null; }
  }
  if (c.concentration && c.hp.current > 0){
    const dc = Math.max(10, Math.floor(n/2));
    toast(`${esc(c.name)}: concentration check (${esc(c.concentration)}) <b>DC ${dc}</b>, CON save ${sgn(c.abilities.con.save)}`, true);
  }
}
function heal(c, n){
  if (!(n > 0)) return;
  if (c.hp.current === 0){ c.conditions = c.conditions.filter(x => x !== 'Unconscious'); c.deathSaves = {successes:0, failures:0}; }
  c.hp.current = Math.min(c.hp.max, c.hp.current + n);
}
function shortRestChar(c){
  c.resources.forEach(r => { if (r.reset === 'short' || r.reset === 'turn') r.used = 0; });
  if (c.pactSlots) c.pactSlots.used = 0;
}
function longRestChar(c){
  shortRestChar(c);
  c.resources.forEach(r => { if (r.reset === 'long' || r.reset === 'dawn') r.used = 0; });
  c.spellSlots.forEach(s => s.used = 0);
  c.hp.current = c.hp.max; c.hp.temp = 0;
  c.deathSaves = {successes:0, failures:0};
  c.conditions = c.conditions.filter(x => x !== 'Unconscious');
  c.concentration = null;
  let regain = Math.max(1, Math.floor(c.hitDice.reduce((n,h) => n + h.max, 0) / 2));
  [...c.hitDice].sort((a,b) => parseInt(b.die.slice(1)) - parseInt(a.die.slice(1))).forEach(h => { const r = Math.min(regain, h.used); h.used -= r; regain -= r; });
  if (c.exhaustion > 0) c.exhaustion--;
}

/* =====================================================================
   RENDER — shared bits
   ===================================================================== */
function portraitHTML(c){
  const img = P[c.id];
  return `<button class="portrait" data-act="portrait" data-cid="${c.id}" title="Click to upload a portrait"
    ${img ? `style="background-image:url('${img}')"` : ''}>${img ? '' : esc(initials(c.name))}</button>`;
}
/** Pips for any counter {max, used}. kind = slot|res; ref identifies it. */
function pipsHTML(c, obj, kind, ref){
  if (obj.max == null) return `<input type="number" min="0" placeholder="max" style="width:56px;padding:1px 4px;font-size:12px" data-resmax="${ref}" data-cid="${c.id}" title="Max not on the sheet: set it here">`;
  if (obj.max > 8) return `<span class="qty"><button data-act="resn" data-d="1" data-cid="${c.id}" data-rid="${ref}" title="Use one">−</button><span>${obj.max - obj.used}/${obj.max}</span><button data-act="resn" data-d="-1" data-cid="${c.id}" data-rid="${ref}" title="Regain one">+</button></span>`;
  return `<span class="pips">${Array.from({length:obj.max}, (_, i) => {
    const used = i >= obj.max - obj.used;
    return `<button class="pip ${used ? 'used' : 'avail'}" data-act="pip" data-kind="${kind}" data-ref="${ref}" data-cid="${c.id}" data-i="${i}" title="${used ? 'Used' : 'Available'}: click to toggle"></button>`;
  }).join('')}</span>`;
}
const resetTag = r => ({short:'SR', long:'LR', dawn:'dawn', turn:'turn', none:''}[r.reset] || '');

/* =====================================================================
   RENDER — card summary
   ===================================================================== */
function hpHTML(c){
  const pct = c.hp.max ? Math.max(0, Math.min(100, c.hp.current / c.hp.max * 100)) : 0;
  const tpct = c.hp.max ? Math.min(100 - pct, c.hp.temp / c.hp.max * 100) : 0;
  const cls = pct <= 25 ? 'low' : pct <= 50 ? 'mid' : '';
  return `<div class="hpbar"><div class="hpfill ${cls}" style="width:${pct}%"></div><div class="hptemp" style="left:${pct}%;width:${tpct}%"></div>
      <div class="hptext">${c.hp.current} / ${c.hp.max}${c.hp.temp ? ` &nbsp;+${c.hp.temp} temp` : ''}</div></div>
    <div class="hpctl">
      <input type="number" min="0" inputmode="numeric" placeholder="amt" data-hpin="${c.id}" aria-label="HP amount">
      <button class="b-dmg" data-act="hp" data-op="dmg" data-cid="${c.id}">Damage</button>

/** Whatever file was picked becomes a campaign state: a campaign export, an old backup, a party file, or one character. */
function stateFromFile(d, name){
  if (d.campaign && d.campaign.characters) return {st: d.campaign, portraits: d.portraits || {}};
  const portraits = d.portraits || {}; d = Object.assign({}, d); delete d.portraits;
  if (d.characters && d.purse) return {st: d, portraits};
  if (d.characters){ const st = fromSeed(d); if (name) st.name = name; return {st, portraits}; }
  if (d.abilities && d.name) return {st: fromSeed({name: name || 'New campaign', characters:[d]}), portraits};
  return null;
}

function readCharForm(cid){
  const g = id => { const el = document.getElementById('ff_' + id); return el ? (el.type === 'checkbox' ? el.checked : el.value.trim()) : ''; };
  const n = id => { const v = g(id); return v === '' || v === false ? null : Number(v); };
  const name = g('name'); if (!name){ toast('Give the character a name'); $('#ff_name').focus(); return null; }
  const old = cid ? charById(cid) : null;
  const classes = [{name: g('c1') || 'Adventurer', subclass: g('s1'), level: Math.max(1, n('l1') || 1)}];
  if (g('c2')) classes.push({name: g('c2'), subclass: g('s2'), level: Math.max(1, n('l2') || 1)});
  const level = classes.reduce((t,k) => t + k.level, 0);
  const pb = n('pb') ?? pbFor(level);
  const abilities = {}, extra = n('saveExtra') || 0;
  ABILS.forEach(a => { const score = n('ab_' + a) ?? 10, mod = Math.floor((score - 10) / 2), sp = !!g('sp_' + a);
    abilities[a] = {score, mod, saveProf: sp, save: mod + (sp ? pb : 0) + extra}; });
  const skills = {};
  Object.keys(SKN).forEach(k => { const ab = old ? old.skills[k].ability : SKILL_AB[k], prof = g('sk_' + k) || 'none';
    // keep any extra bonus the sheet had on this skill (items, features) when its proficiency is unchanged
    const oldProf = old && (old.skills[k].prof === 'other' ? 'prof' : old.skills[k].prof);
    const keep = old && oldProf === prof ? old.skills[k].mod - old.abilities[ab].mod - PROF_ADD(old.skills[k].prof, old.profBonus) : 0;
    skills[k] = {mod: abilities[ab].mod + PROF_ADD(prof, pb) + keep, ability: ab, prof}; });
  let hitDice = [];
  const hdTxt = g('hd');
  if (hdTxt) hdTxt.split('+').forEach(part => { const m = part.trim().match(/^(\d+)\s*(d\d+)$/i); if (m) hitDice.push({die: m[2].toLowerCase(), max: +m[1]}); });
  if (!hitDice.length) hitDice = [{die: g('die') || (old ? old.hitDice[0].die : 'd8'), max: level}];
  hitDice = hitDice.map(h => { const o = old && old.hitDice.find(x => x.die === h.die); return Object.assign(h, {used: o ? Math.min(h.max, o.used) : 0}); });
  const slots = [1,2,3,4,5,6,7,8,9].map(l => ({level: l, max: n('sl_' + l) || 0})).filter(s => s.max)
    .map(s => { const o = old && old.spellSlots.find(x => x.level === s.level); return Object.assign(s, {used: o ? Math.min(s.max, o.used) : 0}); });
  const pactN = n('pactN'), pactL = n('pactL');
  const split = s => s ? s.split(';').map(x => x.trim()).filter(Boolean) : [];
  const out = {
    name, species: g('species'), background: g('background'), alignment: g('alignment'), size: g('size') || 'Medium',
    classes, level, profBonus: pb, ac: n('ac') ?? 10, initiative: n('init') ?? abilities.dex.mod, speed: {walk: n('speed') ?? 30},
    abilities, skills, hitDice, spellSlots: slots,
    pactSlots: pactN ? {level: pactL || 1, max: pactN, used: old && old.pactSlots ? Math.min(pactN, old.pactSlots.used) : 0, reset:'short'} : null,
    passive: {perception: n('pp') ?? 10 + skills.perception.mod, insight: n('pi') ?? 10 + skills.insight.mod, investigation: n('pv') ?? 10 + skills.investigation.mod},
    senses: g('senses') ? g('senses').split(',').map(x => x.trim()).filter(Boolean) : [],
    defenses: {resistances: split(g('resist')), immunities: split(g('immune')), saveNotes: split(g('saveNotes'))},
    proficiencies: {armor: g('armor'), weapons: g('weapons'), tools: g('tools'), languages: g('languages')},
    attacksPerAction: Math.max(1, n('apa') || 1), bonusAttack: g('bonusAtk') || null,
    hpMax: n('hpmax'),
  };
  if (document.getElementById('ff_castAb')){
    const ab = g('castAb');
    out.spellcasting = ab ? [{class: classes[0].name, ability: ab, dc: n('castDc') ?? 8 + pb + abilities[ab].mod, attack: n('castAtk') ?? pb + abilities[ab].mod}] : [];
    out.preparedLimit = n('prepLimit') || undefined;
  }
  return out;
}

/* =====================================================================
   SHEET UPDATE MERGE
   Sheet-owned: identity, stats, skills, max HP, attacks, spell list,
   features, slot/resource maximums, proficiencies, defences.
   Session-owned (kept): current HP, temp, used slots/resources/hit dice,
   conditions, concentration, notes, journal, portraits, item notes,
   prepared choices, purse.
   ===================================================================== */
const SCALARS = [['level','Level'],['xp','XP'],['species','Species'],['background','Background'],['ac','AC'],['initiative','Initiative'],
  ['profBonus','Proficiency bonus'],['attacksPerAction','Attacks per Attack action'],['bonusAttack','Bonus-action attack'],['speed.walk','Speed'],['hp.max','Max HP'],['preparedLimit','Prepared spell limit'],
  ['passive.perception','Passive Perception'],['passive.insight','Passive Insight'],['passive.investigation','Passive Investigation']];
const getp = (o, p) => p.split('.').reduce((x,k) => x == null ? x : x[k], o);
function setp(o, p, v){ const ks = p.split('.'); const last = ks.pop(); ks.reduce((x,k) => x[k] = x[k] || {}, o)[last] = v; }
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
function diffChar(old, nu){
  const ch = [];
  const add = (group, label, html, apply, def = true) => ch.push({id: uid(), group, label, html, apply, def});
  if (!same(old.classes, nu.classes)) add('Core', 'Classes', `<span class="old">${esc(classLine(old))}</span> → <span class="new">${esc(classLine(nu))} (${esc(subLine(nu))})</span>`, c => c.classes = clone(nu.classes));
  SCALARS.forEach(([p,l]) => { const a = getp(old,p), b = getp(nu,p);
    if (b !== undefined && !same(a,b)) add('Core', l, `<span class="old">${esc(a ?? '—')}</span> → <span class="new">${esc(b)}</span>`, c => {
      if (p === 'hp.max'){ const d = b - c.hp.max; c.hp.max = b; c.hp.current = Math.max(0, Math.min(b, c.hp.current + Math.max(0,d))); }
      else setp(c, p, clone(b)); }); });
  ABILS.forEach(a => { const A = old.abilities[a], B = nu.abilities[a];
    if (!same(A,B)) add('Abilities & saves', ABFULL[a], `<span class="old">${A.score} (${sgn(A.mod)}), save ${sgn(A.save)}</span> → <span class="new">${B.score} (${sgn(B.mod)}), save ${sgn(B.save)}${B.saveProf ? ' ●' : ''}</span>`, c => c.abilities[a] = clone(B)); });
  Object.keys(SKN).forEach(k => { const A = old.skills[k], B = nu.skills && nu.skills[k];
    if (B && !same(A,B)) add('Skills', SKN[k], `<span class="old">${sgn(A.mod)} ${profMark(A.prof)}</span> → <span class="new">${sgn(B.mod)} ${profMark(B.prof)}</span>`, c => c.skills[k] = clone(B)); });
  // attacks: sheet attacks update, attacks you added or edited are kept
  const sheetAtks = (old.attacks||[]).filter(a => !a.custom), mine = (old.attacks||[]).filter(a => a.custom);
  if (nu.attacks && !same(sheetAtks, nu.attacks.filter(a => !mine.some(m => m.name === a.name))))
    add('Combat & proficiencies', 'Attacks', `updated from the sheet${mine.length ? ` <span class="dim">(your ${mine.length} custom attack${mine.length > 1 ? 's are' : ' is'} kept)</span>` : ''}`,
      c => { const keep = c.attacks.filter(a => a.custom); c.attacks = nu.attacks.filter(a => !keep.some(m => m.name === a.name)).concat(keep); });
  ['senses','defenses','proficiencies','spellcasting'].forEach(k => {
    if (nu[k] !== undefined && !same(old[k], nu[k])) add('Combat & proficiencies', k[0].toUpperCase()+k.slice(1), 'updated from the sheet', c => c[k] = clone(nu[k])); });
  if (!same(old.hitDice.map(h => [h.die,h.max]), nu.hitDice.map(h => [h.die,h.max])))
    add('Core', 'Hit dice', `<span class="old">${old.hitDice.map(h => h.max + h.die).join(' + ')}</span> → <span class="new">${nu.hitDice.map(h => h.max + h.die).join(' + ')}</span>`, c => {
      c.hitDice = nu.hitDice.map(h => { const o = c.hitDice.find(x => x.die === h.die); return {die:h.die, max:h.max, used: Math.min(h.max, o ? o.used : 0)}; }); });
  const slotStr = s => (s||[]).filter(x => x.max).map(x => `${ORD(x.level)}×${x.max}`).join(' ');
  if (!same((old.spellSlots||[]).map(x => [x.level,x.max]), (nu.spellSlots||[]).map(x => [x.level,x.max])))
    add('Spell slots', 'Slots', `<span class="old">${slotStr(old.spellSlots) || 'none'}</span> → <span class="new">${slotStr(nu.spellSlots)}</span>`, c => {
      c.spellSlots = nu.spellSlots.map(s => { const o = c.spellSlots.find(x => x.level === s.level); return {level:s.level, max:s.max, used: Math.min(s.max, o ? o.used : 0)}; }); });
  if (!same(old.pactSlots && [old.pactSlots.level, old.pactSlots.max], nu.pactSlots && [nu.pactSlots.level, nu.pactSlots.max]))
    add('Spell slots', 'Pact slots', `<span class="old">${old.pactSlots ? old.pactSlots.max + '×' + ORD(old.pactSlots.level) : 'none'}</span> → <span class="new">${nu.pactSlots ? nu.pactSlots.max + '×' + ORD(nu.pactSlots.level) : 'none'}</span>`,
      c => c.pactSlots = nu.pactSlots ? Object.assign({}, nu.pactSlots, {used: Math.min(nu.pactSlots.max, c.pactSlots ? c.pactSlots.used : 0)}) : null);
  (nu.resources||[]).forEach(r => { const o = old.resources.find(x => x.id === r.id);
    if (!o) add('Limited uses', r.name, `<span class="add">+ new: ${esc(r.name)} (${r.max ?? '?'} / ${r.reset})</span>`, c => c.resources.push(Object.assign({used:0}, clone(r))));
    else if (r.max != null && ((o.max !== r.max) || o.reset !== r.reset || o.die !== r.die))
      add('Limited uses', r.name, `<span class="old">${o.max ?? '?'} ${o.die || ''}</span> → <span class="new">${r.max} ${r.die || ''} (${r.reset})</span>${o.edited ? ' <span class="dim">(you edited this)</span>' : ''}`, c => { const x = resById(c, r.id); Object.assign(x, {max:r.max, reset:r.reset, die:r.die}); x.used = Math.min(x.used, r.max ?? x.used); }, !o.edited); });
  old.resources.filter(o => !o.custom && !(nu.resources||[]).some(r => r.id === o.id)).forEach(o =>
    add('Limited uses', o.name, `<span class="rem">− no longer on the sheet: ${esc(o.name)}</span>`, c => c.resources = c.resources.filter(x => x.id !== o.id), false));
  const sk = s => s.id || slug(s.name + '-' + s.source);   // imported sheets carry their own ids
  (nu.spells||[]).forEach(s => { if (!old.spells.some(o => o.id === sk(s)))
    add('Spells', s.name, `<span class="add">+ ${esc(s.name)}</span> <span class="dim">${s.level ? ORD(s.level) + ' level' : 'cantrip'} · ${esc(s.source)}</span>`, c => c.spells.push(Object.assign({}, clone(s), {id: sk(s), prepared: c.preparedLimit ? !!s.alwaysPrepared : true}))); });
  old.spells.filter(o => !o.custom && !(nu.spells||[]).some(s => sk(s) === o.id)).forEach(o =>
    add('Spells', o.name, `<span class="rem">− ${esc(o.name)}</span> <span class="dim">no longer on the sheet</span>`, c => c.spells = c.spells.filter(x => x.id !== o.id)));
  const fk = f => f.id || slug(f.name);
  (nu.features||[]).forEach(f => { const o = (old.features||[]).find(x => fk(x) === fk(f));
    if (!o) add('Features', f.name, `<span class="add">+ ${esc(f.name)}</span>`, c => c.features.push(Object.assign({id: fk(f)}, clone(f))));
    else if (!o.custom && (o.text !== f.text || o.name !== f.name || o.res !== f.res))
      add('Features', f.name, o.edited ? 'the sheet differs from your edited version' : 'description or uses updated', c => Object.assign(c.features.find(x => fk(x) === fk(f)), clone(f), {edited:false}), !o.edited); });
  (old.features||[]).filter(o => !o.custom && !(nu.features||[]).some(f => fk(f) === fk(o))).forEach(o =>
    add('Features', o.name, `<span class="rem">− ${esc(o.name)}</span> <span class="dim">not on the new sheet</span>`, c => c.features = c.features.filter(x => fk(x) !== fk(o)), false));
  delete nu.coins;
  (nu.inventory||[]).forEach(i => { const o = old.inventory.find(x => x.name === i.name);
    if (!o) add('Inventory', i.name, `<span class="add">+ ${esc(i.name)} ×${i.qty}</span>`, c => c.inventory.push(Object.assign({}, clone(i), {id: slug(i.name), notes: i.notes || ''})));
    else {
      if (o.qty !== i.qty) add('Inventory', i.name, `${esc(i.name)}: <span class="old">×${o.qty}</span> → <span class="new">×${i.qty}</span> <span class="dim">(app ×${o.qty} may be more current)</span>`, c => c.inventory.find(x => x.id === o.id).qty = i.qty, false);
      if (o.attuned !== i.attuned) add('Inventory', i.name, `${esc(i.name)}: ${i.attuned ? 'now attuned' : 'no longer attuned'}`, c => c.inventory.find(x => x.id === o.id).attuned = i.attuned);
    } });
  old.inventory.filter(o => !o.custom && !(nu.inventory||[]).some(i => i.name === o.name)).forEach(o =>
    add('Inventory', o.name, `<span class="rem">− ${esc(o.name)}</span> <span class="dim">${o.custom ? 'you added this in the app' : 'not on the sheet any more'}</span>`, c => c.inventory = c.inventory.filter(x => x.id !== o.id), false));
  Object.entries(nu.notes||{}).forEach(([k,v]) => { if (k === 'session') return; const a = (old.notes||{})[k];
    if (v && v !== a) add('Bio', k, `${esc(k)} updated from the sheet`, c => { c.notes = c.notes || {}; c.notes[k] = v; }, !a); });
  return ch;
}
let pendingMerge = null;
/** After creating a campaign from PDFs: what was read, and anything to check. */
function importReport(data, title){
  const items = data.characters.map(c => { const w = (data.warnings || {})[c.id] || [];
    return `<div class="dgrp"><h3>${esc(c.name)} <span class="small muted">${esc(c.classes.map(k => `${k.name} ${k.level}`).join(' / '))}</span></h3>
      <div class="small muted">${c.features.length} features · ${c.spells.length} spells · ${c.inventory.length} items · ${c.resources.length} limited uses</div>
      ${w.length ? `<ul class="small" style="margin:4px 0 0 18px;padding:0">${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="small" style="color:var(--green2)">Nothing to check.</div>'}</div>`; }).join('');
  openModal(() => `${mhead(title)}<div class="mbody diff">${items}
    <div class="small dim" style="margin-top:8px">The party purse holds everyone's coins added together. Homebrew item rules don't come through from D&amp;D Beyond: open an item and use ✎ Edit to add them.</div></div>
    <div class="mfoot"><button class="pri" data-act="mclose">Done</button></div>`, true);
}
function startMerge(data, targetId){
  if (data.campaign) data = data.campaign;
  const warnings = data.warnings || {};
  const incoming = (data.characters ? data.characters : [data]).slice();
  if (targetId && incoming.length > 1){ const t = charById(targetId); const hit = incoming.filter(c => c.id === targetId || c.name === t.name); if (hit.length) incoming.splice(0, incoming.length, ...hit); }
  const plan = incoming.map(nu => {
    nu = normaliseChar(clone(nu));
    const old = (targetId && incoming.length === 1 ? charById(targetId) : null) || S.characters.find(c => c.id === nu.id) || S.characters.find(c => c.name === nu.name);
    if (!old) nu.id = uniqueId(S, nu.id || slug(nu.name));
    return {nu, old, changes: old ? diffChar(old, nu) : [], warnings: warnings[nu.id] || warnings[slug(nu.name)] || []};
  });
  pendingMerge = plan;
  openModal(() => {
    const warnBlock = p => p.warnings.length ? `<div class="small" style="margin:4px 0 6px;color:var(--gold2)">Check after import:<ul style="margin:2px 0 0 18px;padding:0;color:var(--muted)">${p.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
    const blocks = plan.map((p, pi) => {
      if (!p.old) return `<div class="dgrp"><h3>${esc(p.nu.name)} <span class="small muted">${esc(classLine(p.nu))}</span></h3><label><input type="checkbox" data-mnew="${pi}" checked><span class="add">New character: add to the party${p.nu.coins ? ' (their coins go into the party purse)' : ''}</span></label>${warnBlock(p)}</div>`;
      if (false) return `<div class="dgrp"><h3>${esc(p.nu.name)}</h3><label><input type="checkbox" data-mnew="${pi}" checked><span class="add">New character: add to the party</span></label></div>`;
      if (!p.changes.length) return `<div class="dgrp"><h3>${esc(p.nu.name)}</h3><div class="empty">No changes.</div></div>`;
      const groups = {}; p.changes.forEach(ch => (groups[ch.group] = groups[ch.group] || []).push(ch));
      return `<div class="dgrp"><h3>${esc(p.nu.name)} <span class="small muted">${p.changes.length} change${p.changes.length>1?'s':''}</span></h3>${warnBlock(p)}

          ${list.map(ch => `<label><input type="checkbox" data-mch="${ch.id}" ${ch.def ? 'checked' : ''}><span><b>${esc(ch.label)}</b>: ${ch.html}</span></label>`).join('')}`).join('')}</div>`;
    }).join('');
    const allNew = plan.every(p => !p.old);
    return `${mhead(allNew ? 'Add characters' : 'Review sheet update')}<div class="mbody diff">
      <div class="small muted" style="margin-bottom:8px">Ticked changes are applied. Item removals and quantity changes start unticked because the app is usually more up to date than the sheet. Undo is available afterwards.</div>
      ${blocks}</div><div class="mfoot"><button data-act="mclose">Cancel</button><button class="pri" data-act="applyMerge">Apply ticked changes</button></div>`; }, true);
}
function applyMerge(){
  if (!pendingMerge) return;
  const ticked = new Set([...document.querySelectorAll('[data-mch]:checked')].map(x => x.dataset.mch));
  const newOK = new Set([...document.querySelectorAll('[data-mnew]:checked')].map(x => +x.dataset.mnew));
  let n = 0;
  const plan = pendingMerge; pendingMerge = null; closeModal();
  mutate(() => plan.forEach((p, pi) => {
    if (!p.old){ if (newOK.has(pi)){ const coins = p.nu.coins; delete p.nu.coins;
        if (coins) COINS.forEach(k => S.purse[k] += coins[k] || 0);
        S.characters.push(p.nu); n++; } return; }
    const c = charById(p.old.id);
    p.changes.filter(ch => ticked.has(ch.id)).forEach(ch => { ch.apply(c); n++; });
  }));
  toast(`Applied ${n} change${n === 1 ? '' : 's'}`);
}

let O5 = {};

  if (!results || !results.length) return null;

  return results.find(r => /srd/.test(docKey(r)) && docKey(r).includes(want)) || results.find(r => /srd|5esrd|wotc/.test(docKey(r))) || results[0];
}
async function o5Find(kind, name){
  const key = `${kind}|${S.ruleset}|${name.toLowerCase()}`;
  const hit = O5[key];
  if (hit && (hit.data || Date.now() - hit.t < 864e5)) return hit.data;
  const q = encodeURIComponent(name);
  const attempts = kind === 'spell'
    ? [`/v2/spells/?name__iexact=${q}`, `/v2/spells/?search=${q}`, `/v1/spells/?name=${q}`]
    : [`/v2/items/?name__iexact=${q}`, `/v2/magicitems/?name__iexact=${q}`, `/v2/weapons/?name__iexact=${q}`, `/v2/armor/?name__iexact=${q}`, `/v1/magicitems/?search=${q}`, `/v2/items/?search=${q}`];
  let data = null, reached = false;
  for (const a of attempts){
    try {
      const j = await o5Get(a); reached = true;
      const res = (j.results || []).filter(r => !/search=/.test(a) || String(r.name).toLowerCase() === name.toLowerCase() || attempts.indexOf(a) === attempts.length - 1);
      data = pick(res); if (data) break;
    } catch(e){ if (/HTTP 4\d\d/.test(e.message)) reached = true; }
  }
  if (!data && !reached) throw new Error('offline or blocked');
  O5[key] = {t: Date.now(), data}; o5Save();
  return data;
}

/* =====================================================================
   D&D BEYOND PDF IMPORT
   D&D Beyond's character-sheet PDF keeps every value in a named form
   field. pdf.js reads those fields; parseDDB turns them into a character.

const DDB = (() => {
  const key = s => String(s || '').toLowerCase().replace(/\s+/g, '');

  const slugify = s => String(s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const ABFULL = {str: 'strength', dex: 'dexterity', con: 'constitution', int: 'intelligence', wis: 'wisdom', cha: 'charisma'};
  // app skill key -> [value field, proficiency field, ability field] (normalised field names)
  const SKILLS = {acrobatics: ['acrobatics', 'acrobaticsprof', 'acrobaticsmod'], animalHandling: ['animal', 'animalhandlingprof', 'animalmod'],
    arcana: ['arcana', 'arcanaprof', 'arcanamod'], athletics: ['athletics', 'athleticsprof', 'athleticsmod'], deception: ['deception', 'deceptionprof', 'deceptionmod'],
    history: ['history', 'historyprof', 'historymod'], insight: ['insight', 'insightprof', 'insightmod'], intimidation: ['intimidation', 'intimidationprof', 'intimidationmod'],
    investigation: ['investigation', 'investigationprof', 'investigationmod'], medicine: ['medicine', 'medicineprof', 'medicinemod'], nature: ['nature', 'natureprof', 'naturemod'],
    perception: ['perception', 'perceptionprof', 'perceptionmod'], performance: ['performance', 'performanceprof', 'performancemod'], persuasion: ['persuasion', 'persuasionprof', 'persuasionmod'],
    religion: ['religion', 'religionprof', 'religionmod'], sleightOfHand: ['sleightofhand', 'sleightofhandprof', 'sleightofhandmod'], stealth: ['stealth', 'stealthprof', 'stealthmod'],
    survival: ['survival', 'survivalprof', 'survivalmod']};
  const SKILL_AB = {acrobatics: 'dex', animalHandling: 'wis', arcana: 'int', athletics: 'str', deception: 'cha', history: 'int', insight: 'wis', intimidation: 'cha', investigation: 'int',
    medicine: 'wis', nature: 'int', perception: 'wis', performance: 'cha', persuasion: 'cha', religion: 'int', sleightOfHand: 'dex', stealth: 'dex', survival: 'wis'};
  const PROF = {'': 'none', P: 'prof', E: 'expert', H: 'half'};
  const SUBCLASS_RE = /archetype|patron|domain|college|primal path|tradition|circle|origin|oath|conclave|subclass|sorcerous/i;
  const SKIP_FEATURES = /^(hit points|proficiencies|ability score (increase|improvement)|expanded spell list|bonus proficienc(y|ies)|languages?|age|alignment|size|speed|creature type|core .* traits)$/i;
  const PREPARES = {cleric: 1, druid: 1, wizard: 1, paladin: 0.5, artificer: 0.5};
  const MAGIC_RE = /potion|scroll|\+\d|wand|staff of|rod of|ring of|cloak of|boots of|amulet|helm of|bracers|gauntlets of|belt of|gloves of|cape of|robe of|bag of holding|haversack|charm of|ioun|elixir|oil of/i;
  const CONSUMABLE_RE = /potion|scroll|ration|arrow|bolt|bullet|needle|dart|oil|torch|candle|holy water|healer'?s kit|poison|incense|chalk|ink|paper|parchment|piton|caltrops|ball bearings/i;

  function fieldsOf(pages){
    const f = {};
    pages.forEach((p, pi) => p.widgets.forEach(w => { const k = key(w.name); const v = w.value == null ? '' : String(w.value);
      if (!(k in f) || (f[k] === '' && v !== '')) f[k] = v; }));
    return f;
  }
  const joinBlocks = (f, prefix) => { const parts = []; for (let i = 1; i < 20; i++){ const v = f[prefix + i]; if (v === undefined) break; if (v.trim()) parts.push(v); } return parts.join('\n'); };

  }
  function effectOf(text){

  /** The Actions box: === ACTIONS / BONUS ACTIONS / REACTIONS / SPECIAL === with "Name • 1 / Short Rest" entries. */
  function parseActions(text){
    const out = []; let sec = null, cur = null;
    const SECS = {'actions': 'action', 'bonus actions': 'bonus', 'reactions': 'reaction', 'special': 'special', 'other': 'special', 'limited use': 'special'};
    text.split('\n').forEach(raw => {
      const line = raw.replace(/\s+$/, ''); if (!line.trim()) return;
      const h = line.match(/^===\s*(.+?)\s*===$/);

  }

  /** Features & traits: === SECTION === then "* Name • SRC", description, "| usage" or "| Option • SRC" lines. */
  function parseFeatures(text){
    const out = []; let sec = '', cur = null, sub = null;
    text.split('\n').forEach(raw => {
      const line = raw.trim(); if (!line) return;
      const h = line.match(/^===\s*(.+?)\s*===$/);
      if (h){ sec = h[1].replace(/\s+(FEATURES|TRAITS|SPECIES TRAITS|RACIAL TRAITS)$/i, '').replace(/\b\w+/g, w => w[0] + w.slice(1).toLowerCase()); cur = sub = null; return; }

      if (star){ cur = {name: star[1].trim(), src: sec, ref: (star[2] || '').trim(), text: '', usage: [], options: []}; sub = null; out.push(cur); return; }
      const bar = line.match(/^\|\s*(.+)$/);
      if (bar && cur){
        const t = bar[1].trim();
        const opt = t.match(/^(.+?)\s+•\s+([A-Z][A-Za-z0-9-]*(?:\s+\d+)?)$/);
        if (opt && !/\d+\s*\/\s*(short|long)/i.test(opt[1]) && !actOf(opt[2])){ sub = {name: opt[1].trim(), ref: opt[2], text: ''}; cur.options.push(sub); return; }
        sub = null; cur.usage.push(t); return;
      }
      if (sub) sub.text = (sub.text ? sub.text + ' ' : '') + line;
      else if (cur) cur.text = (cur.text ? cur.text + ' ' : '') + line;
    });
    return out;
  }

  function parseSpells(pages, f, warn){
    const rows = {}, levelOfRow = {}, slots = {}; let pact = null, level = null;
    pages.forEach(p => p.widgets.forEach(w => {
      const k = key(w.name), v = String(w.value || '');
      let m;
      if ((m = k.match(/^spellheader(\d+)$/))){ const lm = v.match(/CANTRIPS|(\d)(?:st|nd|rd|th)\s+LEVEL/i); if (lm) level = lm[1] ? +lm[1] : 0; return; }
      if ((m = k.match(/^spellslotheader(\d+)$/))){
        const s = v.match(/(\d+)\s+Slots?/i); if (s && level) slots[level] = +s[1];
        const pm = v.match(/(\d+)\s+Pact/i); if (pm && level) pact = {level, max: +pm[1], used: 0, reset: 'short'};
        return; }
      if ((m = k.match(/^spell(prepared|name|source|savehit|castingtime|range|components|duration|page|notes)(\d+)$/))){
        const i = +m[2]; rows[i] = rows[i] || {}; rows[i][m[1]] = v.trim();

    }));

    Object.keys(rows).map(Number).sort((a, b) => a - b).forEach(i => {
      const r = rows[i]; if (!r.name) return;

  function parseInventory(pages, f){

  function parse(pages){

    } else spells.forEach(s => s.prepared = true);

    const inv = parseInventory(pages, f);
    const added = [...new Set(inv.notes.filter(n => n.add).map(n => n.add))].map(nm => `${nm} ×${inv.items.find(i => i.name === nm).qty}`);
    const dropped = inv.notes.filter(n => n.drop).map(n => n.drop);
    if (added.length) warn.push(`Equipment listed twice on the sheet, quantities added: ${added.join(', ')}.`);
    if (dropped.length) warn.push(`Equipment D&D Beyond repeats on its overflow page, kept once: ${dropped.join(', ')}.`);
    // Wall of Fire etc. from an item: give the item an action that spends its charges

/* pdf.js is only fetched the first time a PDF is imported */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/';
let pdfjsReady = null;
function loadPdfjs(){
  return pdfjsReady = pdfjsReady || import(PDFJS + 'pdf.min.mjs')
    .then(m => { m.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs'; return m; })
    .catch(e => { pdfjsReady = null; throw new Error('Could not load the PDF reader (are you online?)'); });
}
/** Read one D&D Beyond PDF into {character, warnings}. */
async function readDDB(file){
  const pdfjs = await loadPdfjs();
  const task = pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer()), verbosity: 0});
  const doc = await task.promise;
  try {
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++){
      const an = await (await doc.getPage(i)).getAnnotations();
      pages.push({widgets: an.filter(a => a.subtype === 'Widget').map(a => ({name: a.fieldName || '', value: a.fieldValue}))});
    }
    return DDB.parse(pages);
  } finally { task.destroy(); }
}
/** Read every picked PDF; failures are reported per file and skipped. */
async function readSheets(files){
  toast(`Reading ${files.length} sheet${files.length > 1 ? 's' : ''}…`);
  const characters = [], warnings = {}, failed = [];
  for (const f of files){
    try { const r = await readDDB(f); characters.push(r.character); warnings[r.character.id] = r.warnings; }
    catch(e){ failed.push(`${f.name}: ${e.message}`); }
  }
  failed.forEach(m => toast(esc(m), true));
  return {characters, warnings};
}

let portraitTarget = null, jsonMode = null;
$('#fileImg').addEventListener('change', e => {

  img.onload = () => {
    const sc = Math.min(1, 360 / Math.max(img.width, img.height));

/* =====================================================================
   EVENTS (delegated)
   ===================================================================== */
function togglePip(c, kind, ref, i){
  const o = kind === 'slot' ? (ref === 'pact' ? c.pactSlots : c.spellSlots.find(x => x.level === +ref)) : resById(c, ref);
  // tap an available pip = spend one; tap a used pip = regain one
  const avail = o.max - o.used;
  o.used = i < avail ? Math.min(o.max, o.used + 1) : Math.max(0, o.used - 1);
}
function useFeature(c, f, logIt){
  const r = f.res ? resById(c, f.res) : null;
  const eff = f.effect; let msg = `${c.name} uses ${f.name.replace(/ \(.*\)$/,'')}`;
  if (eff && eff.type === 'heal'){
    const roll = parseInt(($('#effRoll')||{}).value, 10);
    if (!(roll > 0)){ toast(`Type the ${esc(eff.die)} roll first`); $('#effRoll') && $('#effRoll').focus(); return false; }
    heal(c, roll + eff.bonus); msg += ` and heals ${roll + eff.bonus}`;
  }
  if (eff && eff.type === 'temp'){ c.hp.temp = Math.max(c.hp.temp, eff.amount); msg += ` (+${eff.amount} temp HP)`; }
  if (r && r.max != null){ if (r.max - r.used <= 0){ toast('None left', true); return false; } r.used++; }
  if (logIt) logEntry([c.id], msg + '.');
  toast(esc(msg));
  return true;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;

  const d = t.dataset, c = d.cid ? charById(d.cid) : null;
  switch (d.act){

    case 'toggle': UI.open[d.cid] = !UI.open[d.cid];

      if (UI.open[d.cid] && sideMode()){ const el = document.getElementById('dock-' + d.cid); if (el) $('#dock').scrollTop = el.offsetTop - $('#dock .dnav').offsetHeight; }

    case 'expandAll': { const all = S.characters.every(x => UI.open[x.id]);
      S.characters.forEach(x => { UI.open[x.id] = !all; if (!all) DEFAULT_SHUT.forEach(k => { if (UI.collapsed[x.id + ':' + k] === undefined) UI.collapsed[x.id + ':' + k] = true; }); });
      saveUI(); renderAll(); break; }
    case 'sbmode': UI.sbMode = d.v; saveUI(); renderAll(); break;
    case 'dockclose': S.characters.forEach(x => UI.open[x.id] = false); saveUI(); renderAll(); break;
    case 'dockjump': { const el = document.getElementById('dock-' + d.cid); if (el) $('#dock').scrollTo({top: el.offsetTop - $('#dock .dnav').offsetHeight, behavior:'smooth'}); break; }
    case 'sect': { const k = d.cid + ':' + d.k; UI.collapsed[k] = !UI.collapsed[k]; saveUI(); renderGrid(); break; }
    case 'hp': {
      const inp = document.querySelector(`[data-hpin="${d.cid}"]`); const n = parseInt(inp.value, 10);
      if (!(n > 0)){ inp.focus(); return; }
      mutate(() => { if (d.op === 'dmg') damage(c, n); else if (d.op === 'heal') heal(c, n); else c.hp.temp = Math.max(c.hp.temp, n); });
      break; }
    case 'death': mutate(() => { const k = d.k, i = +d.i; c.deathSaves[k] = c.deathSaves[k] > i ? i : i + 1;
      if (c.deathSaves.successes >= 3) toast(`${esc(c.name)} is stable`);
      if (c.deathSaves.failures >= 3) toast(`<b>${esc(c.name)} has died.</b> Undo if that was a misclick.`, true); }); break;
    case 'cond': condModal(d.cid); break;
    case 'condinfo': condInfoModal(d.cid, d.v); break;
    case 'concinfo': concModal(d.cid); break;
    case 'togcond': mutate(() => { const i = c.conditions.indexOf(d.v); i >= 0 ? c.conditions.splice(i,1) : c.conditions.push(d.v); }); break;
    case 'rmcond': mutate(() => c.conditions = c.conditions.filter(x => x !== d.v)); break;
    case 'exh': mutate(() => c.exhaustion = +d.v); break;
    case 'dropconc': mutate(() => c.concentration = null); if (UI.modal && /Concentrating/.test($('#modal').textContent)) closeModal(); break;
    case 'pip': mutate(() => togglePip(c, d.kind, d.ref, +d.i)); break;
    case 'resn': mutate(() => { const r = resById(c, d.rid); r.used = Math.max(0, Math.min(r.max, r.used + +d.d)); }); break;
    case 'featinfo': featModal(d.cid, d.fid); break;
    case 'resinfo': resModal(d.cid, d.rid); break;
    case 'iactinfo': iactModal(d.cid, d.iid, d.aid); break;
    case 'iactuse': { const it = c.inventory.find(x => x.id === d.iid), a = it.actions.find(x => x.id === d.aid), r = resById(c, a.res);
      if (r.max != null && r.max - r.used <= 0){ toast('No charges left', true); break; }
      const logIt = $('#featLog') && $('#featLog').checked; closeModal();
      mutate(() => { if (r.max != null) r.used++; if (logIt) logEntry([c.id], `${c.name} uses ${it.name}: ${a.name}.`); });
      toast(`${esc(c.name)}: ${esc(a.name)}${r.max != null ? ` · ${r.max - r.used} charge${r.max - r.used === 1 ? '' : 's'} left` : ''}`); break; }
    case 'editfeat': editFeature(d.cid, d.fid); break;
    case 'addfeat': editFeature(d.cid, null, d.v); break;
    case 'editres': editResource(d.cid, d.rid); break;
    case 'addres': editResource(d.cid, null); break;
    case 'editatk': editAttack(d.cid, +d.i); break;
    case 'addatk': editAttack(d.cid, null); break;
    case 'editspell': editSpell(d.cid, d.sid); break;
    case 'addspell': editSpell(d.cid, null); break;
    case 'edititem': editItem(d.cid, d.iid); break;
    case 'additemfull': editItem(d.cid, null); break;
    case 'editiact': editItemAction(d.cid, d.iid, d.aid); break;

    case 'formsave': { const v = readForm(); const nameField = FORM.fields.find(f => f.k === 'name');

    case 'formdel': { const fn = FORM.onDelete; closeModal(); mutate(fn); toast('Deleted (Undo to restore)'); break; }
    case 'iactdel': closeModal(); mutate(() => { const it = c.inventory.find(x => x.id === d.iid); it.actions = it.actions.filter(x => x.id !== d.aid); }); toast('Action removed (Undo to restore)'); break;

    case 'spellview': UI.spellView[d.cid] = d.v; saveUI(); renderGrid(); break;

    case 'docast': {
